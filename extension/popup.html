<!doctype html><html lang="en"><meta charset="utf-8"><title>CellarTracker MCP</title>
<style>body{font:14px system-ui;width:310px;padding:16px;color:#252525}h1{font-size:18px}p{line-height:1.5}button{padding:8px;margin:10px 8px 0 0}#status{font-weight:600}input{max-width:100%}</style>
<h1>CellarTracker MCP</h1><p>Import the local <code>pairing.json</code> created by <code>npm run setup</code>. Keep a signed-in CellarTracker tab open.</p>
<input type="file" id="pairing" accept="application/json,.json" aria-label="Import local pairing file">
<p id="status" role="status">Checking connection…</p><button id="connect">Connect</button><button id="disconnect">Disconnect</button>
<p>Allows the paired local MCP to read inventory and relocate or log consumption of bottles. Your password and cookies stay in Chrome.</p><script src="popup.js"></script></html>
